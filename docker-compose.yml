services:
  dingtalk:
    image: rela/dingtalk:latest
    container_name: dingtalk
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - PULSE_SERVER=unix:/tmp/pulse-socket
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /dev/shm:/dev/shm
      - /run/user/${HOST_UID:-1000}/pulse/native:/tmp/pulse-socket
      - ${PULSE_COOKIE:-~/.config/pulse/cookie}:/home/dingtalk/.config/pulse/cookie:ro
      - ${DINGTALK_CONFIG:-~/.config/dingtalk-docker}:/home/dingtalk/.config
      - ${DINGTALK_DOWNLOADS:-/tmp}:/home/dingtalk/Downloads
    devices:
      - /dev/dri:/dev/dri
